<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="oscorp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d16"/>
      <stop offset="55%" stop-color="#0e2229"/>
      <stop offset="100%" stop-color="#132a24"/>
    </linearGradient>
    <radialGradient id="oscorp-glow" cx="50%" cy="32%" r="36%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.58"/>
      <stop offset="55%" stop-color="#059669" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070d16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="oscorp-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#34d399" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#oscorp-sky)"/>
  <rect width="800" height="450" fill="url(#oscorp-dots)"/>
  <rect width="800" height="450" fill="url(#oscorp-glow)"/>
  <!-- Midtown skyline backdrop -->
  <g fill="#091118" stroke="#1e3a38" stroke-width="1">
    <rect x="20" y="210" width="76" height="240"/>
    <rect x="108" y="170" width="64" height="280"/>
    <rect x="184" y="240" width="88" height="210"/>
    <rect x="528" y="220" width="82" height="230"/>
    <rect x="622" y="155" width="72" height="295"/>
    <rect x="706" y="195" width="78" height="255"/>
  </g>
  <!-- Oscorp Central Spire -->
  <polygon points="338,450 356,92 400,52 444,92 462,450" fill="#0c1b22" stroke="#34d399" stroke-width="2"/>
  <polygon points="366,450 374,108 400,72 426,108 434,450" fill="#0f2c2a" stroke="#10b981" stroke-width="1.2" opacity="0.85"/>
  <!-- Glowing Emerald Biolab Bands & Hex Grid -->
  <g stroke="#34d399" stroke-opacity="0.45" stroke-width="1.2">
    <line x1="356" y1="120" x2="444" y2="120"/>
    <line x1="354" y1="158" x2="446" y2="158"/>
    <line x1="351" y1="196" x2="449" y2="196"/>
    <line x1="348" y1="238" x2="452" y2="238"/>
    <line x1="345" y1="280" x2="455" y2="280"/>
    <line x1="342" y1="324" x2="458" y2="324"/>
    <line x1="400" y1="52" x2="400" y2="450"/>
  </g>
  <polygon points="368,125 432,125 436,154 364,154" fill="#10b981" opacity="0.4"/>
  <circle cx="400" cy="40" r="3" fill="#6ee7b7"/>
  <line x1="400" y1="22" x2="400" y2="52" stroke="#6ee7b7" stroke-width="2"/>
  <!-- Web swing line & Spider-Man silhouette -->
  <path d="M 140 85 Q 255 215 470 115" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.72"/>
  <g transform="translate(262,158) rotate(-16)">
    <ellipse cx="0" cy="0" rx="11" ry="7" fill="#dc2626" stroke="#090d14" stroke-width="1.5"/>
    <circle cx="11" cy="-3" r="5" fill="#dc2626" stroke="#090d14" stroke-width="1.5"/>
    <path d="M-8 4 L-18 14 M-4 5 L-10 18 M8 -2 L20 -16" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Rain streaks -->
  <g stroke="#bae6fd" stroke-opacity="0.18" stroke-width="1">
    <line x1="70" y1="30" x2="48" y2="95"/><line x1="190" y1="60" x2="168" y2="135"/>
    <line x1="310" y1="20" x2="290" y2="85"/><line x1="510" y1="45" x2="488" y2="120"/>
    <line x1="650" y1="25" x2="626" y2="98"/><line x1="740" y1="80" x2="718" y2="155"/>
    <line x1="120" y1="260" x2="96" y2="335"/><line x1="585" y1="250" x2="562" y2="328"/>
  </g>
</svg>