<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="sv-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <pattern id="sv-halftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.1" fill="#f43f5e" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#sv-sky)"/>
  <rect width="800" height="450" fill="url(#sv-halftone)"/>
  <!-- Dimensional Collider Rings -->
  <g transform="translate(455,165)">
    <circle r="132" stroke="#22d3ee" stroke-width="3" stroke-dasharray="18 8" opacity="0.72"/>
    <circle r="102" stroke="#f43f5e" stroke-width="3" stroke-dasharray="12 10" opacity="0.8"/>
    <circle r="70" stroke="#fbbf24" stroke-width="2.4" opacity="0.88"/>
    <circle r="34" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <!-- Chromatic glitch ribbons -->
  <g opacity="0.55">
    <rect x="90" y="92" width="120" height="5" fill="#22d3ee"/>
    <rect x="115" y="102" width="84" height="4" fill="#f43f5e"/>
    <rect x="615" y="210" width="110" height="5" fill="#22d3ee"/>
    <rect x="592" y="220" width="90" height="4" fill="#fbbf24"/>
  </g>
  <!-- Brooklyn Brownstones & Watertowers -->
  <g fill="#0f0a1e" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5">
    <rect x="0" y="285" width="160" height="165"/>
    <rect x="155" y="250" width="145" height="200"/>
    <rect x="295" y="310" width="170" height="140"/>
    <rect x="460" y="275" width="160" height="175"/>
    <rect x="615" y="235" width="185" height="215"/>
  </g>
  <!-- Rooftop water tower -->
  <line x1="210" y1="250" x2="218" y2="210" stroke="#0f0a1e" stroke-width="4"/>
  <line x1="246" y1="250" x2="238" y2="210" stroke="#0f0a1e" stroke-width="4"/>
  <rect x="208" y="176" width="40" height="36" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.5"/>
  <polygon points="204,176 228,156 252,176" fill="#0f0a1e" stroke="#f43f5e" stroke-width="1.5"/>
  <!-- Lit apartment windows -->
  <g fill="#fbbf24" opacity="0.7">
    <rect x="35" y="310" width="18" height="24"/><rect x="72" y="310" width="18" height="24"/>
    <rect x="180" y="282" width="16" height="22"/><rect x="215" y="282" width="16" height="22"/>
    <rect x="655" y="272" width="18" height="24"/><rect x="698" y="272" width="18" height="24"/>
  </g>
</svg>